# 在 Linux 上验证 OpenNext 构建（推荐生产构建与 CI 使用，避免 Windows 路径/打包差异）
name: OpenNext build (Linux)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: OpenNext Cloudflare build
        run: npm run build:cloudflare

      - name: Debug - List .open-next/assets/_next/static contents
        run: |
          echo "=== Listing .open-next/assets/_next/static ==="
          ls -la .open-next/assets/_next/static/ || echo "Directory not found"
          echo "=== Listing chunks subdirectory ==="
          ls -la .open-next/assets/_next/static/chunks/ || echo "Chunks not found"

      # 需在仓库 Settings → Secrets and variables → Actions 中设置 CLOUDFLARE_API_TOKEN
      #（Workers 写权限的 API 令牌；未设置时本步骤会失败，可先只保留上方构建任务）
      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # wrangler 4.x 无 --once；HTTP 500 时 invocation 仍可能 outcome=ok，勿仅用 --status=error
      - name: Test Worker and capture wrangler tail logs
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          LOGFILE="${RUNNER_TEMP}/wrangler-tail.log"
          npx wrangler tail tradelovin --config wrangler.jsonc --format=json > "$LOGFILE" 2>&1 &
          TAIL_PID=$!
          sleep 5
          echo "=== Request Worker (expect detail in tail JSON) ==="
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" "https://tradelovin.mark-377.workers.dev/" || true
          sleep 8
          kill -INT "$TAIL_PID" 2>/dev/null || true
          wait "$TAIL_PID" 2>/dev/null || true
          echo "=== wrangler tail output (trimmed) ==="
          if [ -s "$LOGFILE" ]; then
            head -c 200000 "$LOGFILE" | while IFS= read -r line || [ -n "$line" ]; do
              echo "$line" | jq -c . 2>/dev/null || echo "$line"
            done
          else
            echo "(empty or missing tail log)"; [ -f "$LOGFILE" ] && cat "$LOGFILE" || true
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
